<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 시제(Tense) 퀴즈</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .question {
            font-size: 1.2em;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .options button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }
        .options button:hover {
            background-color: #2980b9;
        }
        #result {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>📝 영어 시제 마스터 퀴즈</h1>
    <div id="quiz">
        <div class="question" id="question">질문이 여기에 표시됩니다.</div>
        <div class="options" id="options">
            <!-- 버튼들이 여기에 생성됨 -->
        </div>
    </div>
    <div id="result"></div>
</div>

<script>
    const quizData = [
        {
            question: "1. I _____ to the store yesterday.",
            options: ["go", "goes", "went", "gone"],
            correct: 2
        },
        {
            question: "2. She _____ English for 3 years.",
            options: ["studies", "has studied", "is studying", "studied"],
            correct: 1
        },
        {
            question: "3. By the time you arrive, we _____ dinner.",
            options: ["will finish", "finished", "will have finished", "finish"],
            correct: 2
        }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const resultEl = document.getElementById('result');
    const quizEl = document.getElementById('quiz');

    function loadQuestion() {
        const currentQuizData = quizData[currentQuestion];
        questionEl.innerText = currentQuizData.question;
        
        optionsEl.innerHTML = '';
        
        currentQuizData.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.addEventListener('click', () => selectOption(index));
            optionsEl.appendChild(button);
        });
    }

    function selectOption(selectedIndex) {
        if (selectedIndex === quizData[currentQuestion].correct) {
            score++;
        }
        
        currentQuestion++;
        
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizEl.style.display = 'none';
        resultEl.style.display = 'block';
        resultEl.innerHTML = `퀴즈 완료! 🎉<br>당신의 점수는 ${score} / ${quizData.length} 입니다.`;
    }

    // 퀴즈 시작
    loadQuestion();
</script>

</body>
</html>
