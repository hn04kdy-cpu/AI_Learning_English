<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 시제(Tense) 퀴즈</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom smooth fade-in animation */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-8 transition-all duration-300">
    
    <!-- Quiz Header -->
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-indigo-600 mb-2">📝 영어 시제 마스터 퀴즈</h1>
        <p class="text-slate-500 text-sm" id="progress-text">문제 1 / 5</p>
        <!-- Progress Bar -->
        <div class="w-full bg-slate-100 rounded-full h-2.5 mt-3">
            <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 20%"></div>
        </div>
    </div>

    <!-- Quiz Content -->
    <div id="quiz" class="fade-in">
        <div class="text-xl font-semibold text-slate-700 mb-6" id="question">질문이 여기에 표시됩니다.</div>
        
        <div class="space-y-3" id="options">
            <!-- Options will be generated here by JS -->
        </div>

        <!-- Feedback Box (Hidden by default) -->
        <div id="feedback" class="hidden mt-6 p-5 rounded-xl bg-slate-50 border border-slate-200 fade-in">
            <p id="feedback-text" class="text-sm text-slate-700 leading-relaxed"></p>
        </div>

        <!-- Next Button (Hidden by default) -->
        <button id="next-btn" class="hidden mt-6 w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white rounded-xl font-bold text-lg transition-colors duration-200 shadow-md fade-in" onclick="nextQuestion()">
            다음 문제로 <span class="ml-1">→</span>
        </button>
    </div>

    <!-- Result Content (Hidden by default) -->
    <div id="result" class="hidden text-center fade-in py-8">
        <div class="text-6xl mb-4" id="result-emoji">🏆</div>
        <h2 class="text-3xl font-bold text-slate-800 mb-2">퀴즈 완료!</h2>
        <p class="text-lg text-slate-600 mb-6">당신의 최종 점수는...</p>
        
        <div class="inline-block bg-indigo-50 border-2 border-indigo-100 rounded-2xl px-8 py-6 mb-8">
            <span class="text-5xl font-extrabold text-indigo-600" id="score-text">0</span>
            <span class="text-2xl font-bold text-slate-400"> / 5</span>
        </div>

        <p class="text-slate-600 mb-8" id="result-message"></p>

        <button class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-lg transition-colors duration-200 shadow-md" onclick="restartQuiz()">
            다시 도전하기 🔄
        </button>
    </div>

</div>

<script>
    // 5 Quiz Questions with detailed explanations
    const quizData = [
        {
            question: "1. I _____ to the store yesterday.",
            options: ["go", "goes", "went", "have gone"],
            correct: 2,
            explanation: "문장에 'yesterday(어제)'라는 명백한 <b>과거 시간 부사</b>가 있으므로 단순 과거 시제인 <b>went</b>를 사용해야 합니다."
        },
        {
            question: "2. She _____ English for 3 years.",
            options: ["studies", "has studied", "is studying", "studied"],
            correct: 1,
            explanation: "'for 3 years(3년 동안)'는 과거에 시작된 일이 현재까지 이어짐을 나타냅니다. 따라서 <b>현재완료 시제(has + p.p)</b>인 <b>has studied</b>가 정답입니다."
        },
        {
            question: "3. By the time you arrive, we _____ dinner.",
            options: ["will finish", "finished", "will have finished", "finish"],
            correct: 2,
            explanation: "'By the time + 현재시제'는 미래의 특정 시점을 나타냅니다. 그 시점 이전에 완료될 행동을 표현하려면 <b>미래완료 시제(will have + p.p)</b>인 <b>will have finished</b>를 써야 합니다."
        },
        {
            question: "4. I _____ TV when the phone rang.",
            options: ["watch", "am watching", "was watching", "watched"],
            correct: 2,
            explanation: "전화가 울렸던(rang) 과거의 순간에 진행 중이던 동작을 나타내야 합니다. 따라서 <b>과거진행 시제(was/were + -ing)</b>인 <b>was watching</b>이 적절합니다."
        },
        {
            question: "5. Listen! The birds _____ beautifully outside.",
            options: ["sing", "are singing", "sang", "have sung"],
            correct: 1,
            explanation: "'Listen!(들어봐!)'이라는 감탄사는 지금 당장 일어나고 있는 상황에 주의를 기울이게 합니다. 따라서 말하는 순간 진행 중인 동작을 나타내는 <b>현재진행 시제(be + -ing)</b>인 <b>are singing</b>이 정답입니다."
        }
    ];

    let currentQuestion = 0;
    let score = 0;

    // DOM Elements
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const resultEl = document.getElementById('result');
    const quizEl = document.getElementById('quiz');
    const feedbackEl = document.getElementById('feedback');
    const feedbackTextEl = document.getElementById('feedback-text');
    const nextBtn = document.getElementById('next-btn');
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar');

    function loadQuestion() {
        // Reset state for new question
        feedbackEl.classList.add('hidden');
        nextBtn.classList.add('hidden');
        optionsEl.innerHTML = '';
        
        const currentQuizData = quizData[currentQuestion];
        
        // Update UI
        questionEl.innerText = currentQuizData.question;
        progressText.innerText = `문제 ${currentQuestion + 1} / ${quizData.length}`;
        progressBar.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
        
        // Generate options
        currentQuizData.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            // Base Tailwind classes for options
            button.className = "w-full text-left px-5 py-4 rounded-xl border-2 border-slate-200 font-medium text-slate-700 hover:border-indigo-400 hover:bg-indigo-50 transition-all duration-200 focus:outline-none cursor-pointer";
            button.onclick = () => selectOption(index, button);
            optionsEl.appendChild(button);
        });
    }

    function selectOption(selectedIndex, selectedButton) {
        const correctIndex = quizData[currentQuestion].correct;
        const buttons = optionsEl.querySelectorAll('button');
        
        // Disable all buttons to prevent multiple selections
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            btn.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50', 'cursor-pointer');
            btn.classList.add('cursor-not-allowed');

            // Apply colors based on correct/wrong
            if (idx === correctIndex) {
                // Correct answer styles (Green)
                btn.classList.remove('border-slate-200', 'text-slate-700');
                btn.classList.add('border-green-500', 'bg-green-50', 'text-green-700', 'font-bold');
            } else if (idx === selectedIndex && selectedIndex !== correctIndex) {
                // User's wrong answer styles (Red)
                btn.classList.remove('border-slate-200', 'text-slate-700');
                btn.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
            } else {
                // Other options faded out slightly
                btn.classList.add('opacity-50');
            }
        });

        // Show feedback
        feedbackEl.classList.remove('hidden');
        nextBtn.classList.remove('hidden');

        if (selectedIndex === correctIndex) {
            score++;
            feedbackTextEl.innerHTML = `<span class="text-lg font-bold text-green-600 block mb-2">정답입니다! 🎉</span>${quizData[currentQuestion].explanation}`;
            feedbackEl.className = "mt-6 p-5 rounded-xl bg-green-50 border border-green-200 fade-in";
        } else {
            feedbackTextEl.innerHTML = `<span class="text-lg font-bold text-red-600 block mb-2">아쉽게도 오답입니다! 😢</span>${quizData[currentQuestion].explanation}`;
            feedbackEl.className = "mt-6 p-5 rounded-xl bg-red-50 border border-red-200 fade-in";
        }
    }

    function nextQuestion() {
        currentQuestion++;
        
        if (currentQuestion < quizData.length) {
            // Remove fade-in to re-trigger animation
            quizEl.classList.remove('fade-in');
            void quizEl.offsetWidth; // trigger reflow
            quizEl.classList.add('fade-in');
            
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.querySelector('.text-center.mb-8').style.display = 'none'; // Hide header
        quizEl.style.display = 'none';
        resultEl.style.display = 'block';
        
        document.getElementById('score-text').innerText = score;
        
        const messageEl = document.getElementById('result-message');
        const emojiEl = document.getElementById('result-emoji');
        
        if (score === 5) {
            emojiEl.innerText = "🏆";
            messageEl.innerHTML = "완벽합니다! 영어 시제 마스터로 임명합니다! 👏";
        } else if (score >= 3) {
            emojiEl.innerText = "👍";
            messageEl.innerHTML = "아주 잘하셨어요! 조금만 더 연습하면 완벽해질 거예요!";
        } else {
            emojiEl.innerText = "📚";
            messageEl.innerHTML = "포기하지 마세요! 설명을 꼼꼼히 읽고 다시 도전해 보세요!";
        }
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        document.querySelector('.text-center.mb-8').style.display = 'block'; // Show header
        quizEl.style.display = 'block';
        resultEl.style.display = 'none';
        
        // Re-trigger animation
        quizEl.classList.remove('fade-in');
        void quizEl.offsetWidth;
        quizEl.classList.add('fade-in');
        
        loadQuestion();
    }

    // Initialize Quiz
    loadQuestion();
</script>

</body>
</html>
